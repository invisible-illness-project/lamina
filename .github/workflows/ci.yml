name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # NOTE: no --locked — lamina is a library and does not commit Cargo.lock
        # (.gitignore line 4). Toolchain is pinned; deps resolve per semver.
        # Committing a lockfile is a policy decision for the founder.
        run: cargo test
