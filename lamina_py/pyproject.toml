[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "lamina"
version = "0.1.0"
description = "Core scientific and signal-processing library for physiological analysis."
authors = [{name = "Lamina Contributors"}]
dependencies = [
    "maturin>=1.15.0",
    "mypy>=1.19.1",
    "neurokit2>=0.2.13",
    "numpy>=1.20",
    "pytest>=8.4.2",
    "ruff>=0.16.7",
    "seaborn>=0.13.2",
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Signal Processing",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "lamina._lamina"
manifest-path = "Cargo.toml"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "UP",    # Ignores all pyupgrade syntax modernization checks (UP035, UP045, etc.)
    "FA100", # Ignores mandatory 'from __future__ import annotations' requirement
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
